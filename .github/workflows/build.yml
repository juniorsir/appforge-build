name: AppForge Cloud Build
run-name: "AppForge Build [ID: ${{ inputs.app_id }}] - ${{ inputs.app_name }}"
on:
  workflow_dispatch:
    inputs:
      app_id:
        description: 'Unique ID of the app to build'
        required: true
        type: string
      platform:
        description: 'android, ios, or both'
        required: true
        type: string
      project_category:
        description: 'web or native'
        required: true
        type: string
        default: 'web'
      project_type:
        description: 'Framework type (react, flutter, etc)'
        required: true
        type: string
        default: 'unknown'
      app_version:
        description: 'The semantic version of the app build'
        required: false
        type: string
        default: '1.0.0'
      sub_path:
        description: 'The sub-directory of the project within the monorepo'
        required: false
        type: string
        default: '.'
      app_name:
        description: 'The display name of the app'
        required: false
        type: string
        default: 'AppForge App'
      package_id:
        description: 'The unique bundle identifier'
        required: false
        type: string
        default: 'com.appforge.app'
      build_type:
        description: 'Build mode: debug or release'
        required: false
        type: string
        default: 'debug'

jobs:
  # ==========================================
  # 1. WEB APP BUILDER (Capacitor)
  # ==========================================
  build-android:
    if: inputs.project_category == 'web' && (inputs.platform == 'android' || inputs.platform == 'both')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Unzip Uploaded Source
        run: |
          TARGET_DIR="apps/${{ github.event.inputs.app_id }}"
          unzip -o "$TARGET_DIR/source.zip" -d app_workspace

      - name: Set Project Directory
        run: echo "PROJECT_DIR=app_workspace" >> $GITHUB_ENV

      - name: Install JS Dependencies
        run: cd app_workspace && npm install
  
      # --- IN build.yml ---
      
      - name: Build Web App
        run: cd app_workspace && npm run build --if-present
          
      - name: Add Android Platform
        run: |
          cd app_workspace
          npm install @capacitor/android
          npx cap add android

      - name: Capacitor Sync
        run: cd app_workspace && npx cap sync android

      - name: Generate Native Icons & Splash Screens
        run: |
          cd app_workspace
          # Only run if the user provided an icon in the assets folder
          if [ -d "assets" ] && [ -f "assets/icon.png" ]; then
            echo "Generating high-res native icons using @capacitor/assets..."
            npm install -g @capacitor/assets
            npx capacitor-assets generate --android
          else
            echo "No custom assets found. Using default Capacitor icons."
          fi

      - name: Setup Permanent App Signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cd ${{ env.PROJECT_DIR }}/android/app
          
          # 1. Decode the secret back into a real keystore file
          echo $KEYSTORE_BASE64 | base64 --decode > appforge.keystore
          
          # 2. Create the properties file for Node.js to read
          echo "storeFile=appforge.keystore" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      # --- IN THE build-android (Web) JOB ---
      - name: Auto-Inject Native Permissions
        env:
          APP_VERSION: ${{ inputs.app_version }}
          PROJECT_DIR: ${{ env.PROJECT_DIR }} 
          APP_NAME: ${{ inputs.app_name }}         
          PACKAGE_ID: ${{ inputs.package_id }}
          BUILD_TYPE: ${{ inputs.build_type }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          K_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Run from root! No working-directory needed.
          node scripts/inject-permissions.js
      # --------------------------------------

      - name: Build APK
        run: |
          cd app_workspace/android
          chmod +x ./gradlew
          if [ "${{ inputs.build_type }}" == "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appforge-apk-${{ github.event.inputs.app_id }}
          path: app_workspace/android/app/build/outputs/apk/${{ inputs.build_type }}/*.apk
          retention-days: 1

  build-ios:
    if: inputs.project_category == 'web' && (inputs.platform == 'ios' || inputs.platform == 'both')
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unzip Uploaded Source
        run: |
          TARGET_DIR="apps/${{ github.event.inputs.app_id }}"
          unzip -o "$TARGET_DIR/source.zip" -d app_workspace

      - name: Install JS Dependencies
        run: cd app_workspace && npm install

      - name: Build Web App
        run: cd app_workspace && npm run build --if-present
          
      - name: Add iOS Platform
        run: |
          cd app_workspace
          npm install @capacitor/ios
          npx cap add ios

      - name: Capacitor Sync
        run: cd app_workspace && npx cap sync ios

      - name: Zipping Xcode Project 
        run: cd app_workspace && zip -r ios-project.zip ios/
    
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appforge-ios-${{ github.event.inputs.app_id }}
          path: app_workspace/ios-project.zip
          retention-days: 1

  # ==========================================
  # 2. FLUTTER BUILDER (PERFECT ORDER)
  # ==========================================
  build-flutter:
    if: |
      inputs.project_category == 'native' && 
      inputs.project_type == 'flutter' && 
      (contains(inputs.platform, 'android') || contains(inputs.platform, 'all') || contains(inputs.platform, 'both'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          
      - name: Unzip Uploaded Source
        run: unzip -o "apps/${{ inputs.app_id }}/source.zip" -d app_workspace

      - name: Set Project Directory
        id: set_project_dir
        run: |
          if [ "${{ inputs.sub_path }}" != "." ]; then
            echo "PROJECT_DIR=app_workspace/${{ inputs.sub_path }}" >> $GITHUB_ENV
          else
            echo "PROJECT_DIR=app_workspace" >> $GITHUB_ENV
          fi

      # --- REPLACE SANITIZE PUBSPEC WITH THIS ---
      - name: Isolate Project & Sanitize (Nuclear Monorepo Fix)
        run: |
          # 1. If we are in a sub-path, move the project out and delete the rest!
          if [ "${{ inputs.sub_path }}" != "." ]; then
            echo "Isolating sub-project: ${{ inputs.sub_path }}"
            mv "app_workspace/${{ inputs.sub_path }}" app_workspace_temp
            rm -rf app_workspace
            mv app_workspace_temp app_workspace
            # Now the project IS the root workspace!
            echo "PROJECT_DIR=app_workspace" >> $GITHUB_ENV
          fi

          # 2. Now we are guaranteed to be in the root of the actual app
          cd app_workspace
          
          # 3. Aggressively strip monorepo garbage from the ONLY pubspec that matters
          if [ -f "pubspec.yaml" ]; then
            # Convert Windows line endings to Unix just in case
            sed -i 's/\r$//' pubspec.yaml
            
            # Delete the offending lines
            sed -i '/resolution: workspace/d' pubspec.yaml || true
            sed -i '/analysis_defaults:/,+1d' pubspec.yaml || true
            sed -i '/publish_to:/d' pubspec.yaml || true
            
            echo "Sanitization complete."
          else
            echo "No pubspec.yaml found in isolated directory!"
            exit 1
          fi

      - name: Force Regenerate Native Folders
        shell: bash
        run: |
          cd ${{ env.PROJECT_DIR }}
          
          # --- THE BULLETPROOF PYTHON FIX ---
          # Extracts everything before the last dot (e.g. "com.vaultos.app" -> "com.vaultos")
          ORG_NAME=$(python -c "print('.'.join('${{ inputs.package_id }}'.split('.')[:-1]))" 2>/dev/null || echo "com.example")
          # ----------------------------------
          
          rm -rf android/ ios/ windows/ linux/ macos/
          echo "Generating brand new native shells for: $ORG_NAME"
          
          # Run flutter create (the platforms flag will generate whatever the current OS needs)
          flutter create --org $ORG_NAME .


      - name: Install Dependencies
        run: cd ${{ env.PROJECT_DIR }} && flutter pub get

      - name: Fix Broken Plugin Namespaces & Kotlin
        run: |
          find app_workspace -name "build.gradle" -type f | while read file; do
            if grep -q "com.android.library" "$file" && ! grep -q "namespace" "$file"; then
              manifest=$(dirname "$file")/src/main/AndroidManifest.xml
              if [ -f "$manifest" ]; then
                package_name=$(grep -oP 'package="\K[^"]+' "$manifest" || echo "com.example.plugin")
                sed -i "/android {/a \    namespace '${package_name}'" "$file"
              fi
            fi
            if grep -q "kotlin" "$file"; then
              echo "" >> "$file" 
              echo "tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { kotlinOptions { suppressWarnings = true; allWarningsAsErrors = false } }" >> "$file"
            fi
          done
          find ~/.pub-cache/hosted/ -name "*.kt" -type f -exec sed -i 's/\.toLowerCase(/.lowercase(/g' {} +
          find ~/.pub-cache/hosted/ -name "*.kt" -type f -exec sed -i 's/\.toUpperCase(/.uppercase(/g' {} +

      # --- FIXED: THIS MUST RUN BEFORE NODE.JS ---
      - name: Setup Permanent App Signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cd ${{ env.PROJECT_DIR }}/android/app
          echo $KEYSTORE_BASE64 | base64 --decode > appforge.keystore
          echo "storeFile=appforge.keystore" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
      # -------------------------------------------
      
      # --- FIXED: NODE.JS RUNS AFTER KEYSTORE EXISTS ---
      - name: Auto-Inject App Permissions & Metadata
        env:
          APP_VERSION: ${{ inputs.app_version }}
          PROJECT_DIR: ${{ env.PROJECT_DIR }} 
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_ID: ${{ inputs.package_id }}
          BUILD_TYPE: ${{ inputs.build_type }}
          # --- ADD THESE FOUR NEW ENV VARS ---
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          K_PASS: ${{ secrets.KEY_PASSWORD }}
        run: node scripts/inject-permissions.js
      # -------------------------------------------------

      - name: Build Flutter APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          echo "Cleaning old C++ and Gradle caches..."
          flutter clean
          BUILD_NAME="${{ inputs.app_version }}"
          BUILD_NUMBER=$(echo "${{ inputs.app_version }}" | awk -F. '{printf "%d%02d%02d\n", $1, $2, $3}')
          echo "Building ${{ inputs.build_type }} APK..."
          
          # Pass the dynamic --debug or --release flag!
          if [ "${{ inputs.build_type }}" == "release" ]; then
            flutter build apk --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER
          else
            flutter build apk --debug --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER
          fi
        
      # --- REPLACE 'Upload APK Artifact' IN YOUR FLUTTER JOB WITH THIS ---
      - name: Upload APK to Private JStore (Bypass Quota)
        env:
          JSTORE_API_KEY: ${{ secrets.JSTORE_API_KEY }}
        run: |
          cd ${{ env.PROJECT_DIR }}
          APK_PATH="build/app/outputs/flutter-apk/app-${{ inputs.build_type }}.apk"
          
          if [ -f "$APK_PATH" ]; then
            echo "Uploading $APK_PATH to JStore..."
            
            # Use your custom curl command to upload the file and capture the JSON response
            API_RESPONSE=$(curl -s -X POST "https://jstore.2bd.net/api/upload" \
              -H "x-api-key: $JSTORE_API_KEY" \
              -F "file=@$APK_PATH")
              
            echo "API Response: $API_RESPONSE"
            
            # Use jq (installed by default on GitHub runners) to extract the 'url' from the JSON
            DOWNLOAD_URL=$(echo $API_RESPONSE | jq -r '.url')
            
            if [ "$DOWNLOAD_URL" == "null" ] || [ -z "$DOWNLOAD_URL" ]; then
              echo "Error: Failed to parse download URL from JStore API."
              exit 1
            fi
            
            echo "Successfully uploaded! URL: $DOWNLOAD_URL"
            
            # Save this URL to a tiny text file for the Python CLI to find
            echo "$DOWNLOAD_URL" > download_link.txt
          else
            echo "Error: APK not found at $APK_PATH"
            exit 1
          fi
          
      - name: Send Download Link to CLI
        uses: actions/upload-artifact@v4
        with:
          name: appforge-link-${{ github.event.inputs.app_id }}
          path: ${{ env.PROJECT_DIR }}/download_link.txt
          retention-days: 1
      # -------------------------------------------------------------------
            
      # --------------------------------------------
  # 3. NATIVE ANDROID (Kotlin/Java) BUILDER
  # === =====================================
  # --- Android Native Build ---
  build-native-android:
    if: inputs.project_category == 'native' && inputs.project_type == 'android_native'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          
      - name: Unzip Uploaded Source
        run: |
          mkdir -p app_workspace
          unzip -o "apps/${{ github.event.inputs.app_id }}/source.zip" -d app_workspace

      - name: Locate Project Root
        run: |
          # 1. Look for the root build.gradle.kts
          if [ -f "app_workspace/build.gradle.kts" ]; then
            echo "PROJECT_DIR=app_workspace" >> $GITHUB_ENV
            echo "Detected standard Gradle project at root."
          else
            echo "Error: Could not find build.gradle.kts at the root of the workspace."
            ls -R app_workspace
            exit 1
          fi

      - name: Ensure Gradle Wrapper Exists
        run: |
          cd "${{ env.PROJECT_DIR }}"
          if [ ! -f "gradlew" ]; then
            echo "Gradle wrapper not found, generating one..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          
      - name: Inject Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          # Explicitly bring secrets into the shell env
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.KEY_ALIAS }}
          K_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Decode keystore
          mkdir -p "${{ env.PROJECT_DIR }}/app"
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ env.PROJECT_DIR }}/app/my-upload-key.jks"

          # 2. Write ALL secrets into gradle.properties
          # Gradle automatically reads this file when running a build
          echo "KEYSTORE_PASSWORD=${KS_PASS}" >> "${{ env.PROJECT_DIR }}/gradle.properties"
          echo "KEY_ALIAS=${K_ALIAS}" >> "${{ env.PROJECT_DIR }}/gradle.properties"
          echo "KEY_PASSWORD=${K_PASS}" >> "${{ env.PROJECT_DIR }}/gradle.properties"
          echo "STORE_FILE=app/my-upload-key.jks" >> "${{ env.PROJECT_DIR }}/gradle.properties"
          
      - name: Build Native APK
        run: |
          cd "${{ env.PROJECT_DIR }}"
          chmod +x ./gradlew || (gradle wrapper && chmod +x ./gradlew)
          if [ "${{ inputs.build_type }}" == "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appforge-apk-${{ github.event.inputs.app_id }}
          path: "${{ env.PROJECT_DIR }}/build/outputs/apk/**/*.apk"
          retention-days: 1

  # --- Flutter Windows Build ---
  
  # ==========================================
  build-windows:
    if: |
      inputs.project_category == 'native' && 
      inputs.project_type == 'flutter' && 
      (contains(inputs.platform, 'windows') || contains(inputs.platform, 'all'))
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Unzip Uploaded Source
        shell: pwsh
        run: Expand-Archive -Path "apps\${{ inputs.app_id }}\source.zip" -DestinationPath app_workspace

      - name: Set Project Directory
        shell: bash
        run: |
          if [ "${{ inputs.sub_path }}" != "." ]; then
            echo "PROJECT_DIR=app_workspace/${{ inputs.sub_path }}" >> $GITHUB_ENV
          else
            echo "PROJECT_DIR=app_workspace" >> $GITHUB_ENV
          fi

      # --- REPLACE SANITIZE PUBSPEC WITH THIS ---
      - name: Isolate Project & Sanitize (Nuclear Monorepo Fix)
        shell: pwsh
        run: |
          # 1. Isolate the sub-project
          if ("${{ inputs.sub_path }}" -ne ".") {
            Write-Host "Isolating sub-project: ${{ inputs.sub_path }}"
            Move-Item -Path "app_workspace\${{ inputs.sub_path }}" -Destination "app_workspace_temp"
            Remove-Item -Recurse -Force "app_workspace"
            Rename-Item -Path "app_workspace_temp" -NewName "app_workspace"
            # Update env var
            echo "PROJECT_DIR=app_workspace" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

          # 2. Sanitize the main pubspec
          cd app_workspace
          if (Test-Path "pubspec.yaml") {
            $content = Get-Content "pubspec.yaml"
            $newContent = $content | Where-Object { 
              $_ -notmatch 'analysis_defaults:' -and 
              $_ -notmatch 'path:.*analysis_defaults' -and 
              $_ -notmatch 'resolution:\s*workspace' -and
              $_ -notmatch 'publish_to:'
            }
            $newContent | Set-Content "pubspec.yaml"
            Write-Host "Sanitization complete."
          }
          
          flutter config --enable-windows-desktop
      # --- 1. GENERATE FOLDERS FIRST ---
      - name: Force Regenerate Native Folders
        shell: bash
        run: |
          cd ${{ env.PROJECT_DIR }}
          
          # --- THE BULLETPROOF PYTHON FIX ---
          # Extracts everything before the last dot (e.g. "com.vaultos.app" -> "com.vaultos")
          ORG_NAME=$(python -c "print('.'.join('${{ inputs.package_id }}'.split('.')[:-1]))" 2>/dev/null || echo "com.example")
          # ----------------------------------
          
          rm -rf android/ ios/ windows/ linux/ macos/
          echo "Generating brand new native shells for: $ORG_NAME"
          
          # Run flutter create (the platforms flag will generate whatever the current OS needs)
          flutter create --org $ORG_NAME .
          
      # --- 2. INSTALL DEPENDENCIES ---
      - name: Install Dependencies
        shell: bash
        run: cd ${{ env.PROJECT_DIR }} && flutter pub get
        
      # --- 3. CONVERT ICON (Now the folder exists!) ---
      - name: Convert PNG to Windows ICO
        shell: bash
        run: |
          if [ -f "app_workspace/appforge_icon.png" ]; then
            pip install pillow
            python -c "from PIL import Image; img = Image.open('app_workspace/appforge_icon.png'); img.save('${{ env.PROJECT_DIR }}/windows/runner/resources/app_icon.ico', sizes=[(256,256)])"
            echo "Windows .ico generated successfully."
          else
            echo "No custom icon found. Using default."
          fi

      # --- 4. INJECT METADATA ---
      - name: Auto-Inject Metadata
        env:
          APP_VERSION: ${{ inputs.app_version }}
          PROJECT_DIR: ${{ env.PROJECT_DIR }} 
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_ID: ${{ inputs.package_id }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: node scripts/inject-permissions.js
        shell: bash

      # --- 5. BUILD THE APP ---
      - name: Build Windows Desktop App
        shell: bash
        run: |
          cd ${{ env.PROJECT_DIR }}
          BUILD_NAME="${{ inputs.app_version }}"
          BUILD_NUMBER=$(echo "${{ inputs.app_version }}" | awk -F. '{printf "%d%02d%02d\n", $1, $2, $3}')
          flutter build windows --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER

      - name: Zip Windows Artifact
        shell: pwsh
        run: |
          cd ${{ env.PROJECT_DIR }}
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath appforge-windows.zip
        
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appforge-windows-${{ inputs.app_id }}
          path: ${{ env.PROJECT_DIR }}\appforge-windows.zip
          retention-days: 1

  # ==========================================
  # 5. FLUTTER LINUX BUILDER
  # ==========================================
  build-linux:
    if: |
      inputs.project_category == 'native' && 
      inputs.project_type == 'flutter' && 
      (contains(inputs.platform, 'linux') || contains(inputs.platform, 'all'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux Build Requirements
        # Flutter Linux requires these C++ and GTK libraries to compile
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Unzip Uploaded Source
        run: unzip -o "apps/${{ inputs.app_id }}/source.zip" -d app_workspace

      - name: Set Project Directory
        run: |
          if [ "${{ inputs.sub_path }}" != "." ]; then
            echo "PROJECT_DIR=app_workspace/${{ inputs.sub_path }}" >> $GITHUB_ENV
          else
            echo "PROJECT_DIR=app_workspace" >> $GITHUB_ENV
          fi

      # --- UPDATE THIS IN build-linux AND build-flutter ---
      - name: Sanitize Pubspec (Remove Broken Monorepo Links)
        run: |
          cd app_workspace
          echo "Scanning and sanitizing all pubspec.yaml files..."
          
          # A bulletproof loop to find and sanitize every pubspec.yaml file
          find . -name "pubspec.yaml" -type f | while read file; do
            echo "Sanitizing: $file"
            
            # Delete the 'resolution: workspace' line
            sed -i '/resolution: workspace/d' "$file" || true
            
            # Delete the 'analysis_defaults' block (the line and the path below it)
            sed -i '/analysis_defaults:/,+1d' "$file" || true
            
            # Also remove 'publish_to: none' just in case it causes conflicts
            sed -i '/publish_to:/d' "$file" || true
          done
          
          echo "Sanitization complete."

      - name: Force Regenerate Native Folders
        run: |
          cd ${{ env.PROJECT_DIR }}
          # Bulletproof Python extraction of the organization name
          ORG_NAME=$(python3 -c "print('.'.join('${{ inputs.package_id }}'.split('.')[:-1]))" 2>/dev/null || echo "com.example")
          echo "Generating brand new Linux shell for organization: $ORG_NAME"
          
          rm -rf linux/
          flutter create --org $ORG_NAME --platforms=linux .

      - name: Install Dependencies
        run: cd ${{ env.PROJECT_DIR }} && flutter pub get

      - name: Auto-Inject Metadata
        env:
          APP_VERSION: ${{ inputs.app_version }}
          PROJECT_DIR: ${{ env.PROJECT_DIR }} 
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_ID: ${{ inputs.package_id }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: node scripts/inject-permissions.js

      - name: Inject Icon into Linux Bundle
        run: |
          # Copy the custom icon to where Linux expects it (if provided)
          if [ -f "app_workspace/appforge_icon.png" ]; then
            mkdir -p ${{ env.PROJECT_DIR }}/linux/flutter/assets
            cp app_workspace/appforge_icon.png ${{ env.PROJECT_DIR }}/linux/flutter/assets/icon.png
            echo "Linux icon injected successfully."
          else
            echo "No custom icon found. Using default."
          fi

      - name: Build Linux Desktop App
        run: |
          cd ${{ env.PROJECT_DIR }}
          BUILD_NAME="${{ inputs.app_version }}"
          BUILD_NUMBER=$(echo "${{ inputs.app_version }}" | awk -F. '{printf "%d%02d%02d\n", $1, $2, $3}')
          
          echo "Building Linux app: ${{ inputs.app_name }} v$BUILD_NAME..."
          flutter build linux --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER

      - name: Zip Linux Artifact
        run: |
          cd ${{ env.PROJECT_DIR }}/build/linux/x64/release/bundle
          zip -r ../../../../../appforge-linux.zip .
        
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appforge-linux-${{ inputs.app_id }}
          # The path points to the zip file we just created in the root of PROJECT_DIR
          path: ${{ env.PROJECT_DIR }}/appforge-linux.zip
          retention-days: 1
